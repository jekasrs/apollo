<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apollo — архитектура</title>
<style>
  @page { size: A4 portrait; margin: 10mm; }
  * { box-sizing: border-box; }
  html { width: 210mm; margin: 0 auto; background: #e2e8f0; }
  body {
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto;
    padding: 8mm 10mm 12mm;
    background: #fff;
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 9.5pt;
    color: #0f172a;
  }
  h1 { font-size: 12pt; text-align: center; margin: 0 0 2mm; font-weight: 600; }
  .lead { text-align: center; font-size: 8.5pt; color: #64748b; margin: 0 0 5mm; }
  .wrap {
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    padding: 5mm 4mm;
    background: #fafafa;
  }
  svg { display: block; width: 100%; height: auto; }
  figcaption { margin-top: 4mm; font-size: 8pt; color: #64748b; line-height: 1.4; }
  @media print { html { background: #fff; } body { padding: 0; } }
</style>
</head>
<body>

<h1>Emotion Recognition Architecture Apollo</h1>
<figcaption>The branches in the diagram show three modality configuration options: text only, audio only, and a combination of two features converging into a single BiLSTM.
</figcaption>

<div class="wrap">
<svg viewBox="0 0 820 910" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="m" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#0f172a"/>
    </marker>
    <filter id="sh"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity="0.1"/></filter>
  </defs>


  <!-- ========== ВХОД ========== -->
  <rect x="180" y="8" width="460" height="118" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3" filter="url(#sh)"/>
  <text x="410" y="28" text-anchor="middle" font-size="11" font-weight="600">Input</text>
  <rect x="200" y="38" width="200" height="72" rx="5" fill="#fff" stroke="#3b82f6" stroke-width="1"/>
  <text x="300" y="56" text-anchor="middle" font-size="10" font-weight="600">Text</text>
  <text x="300" y="74" text-anchor="middle" font-size="8.5" fill="#334155">BERT embedding</text>
  <text x="300" y="92" text-anchor="middle" font-size="8.5" fill="#1e40af" font-family="Consolas,monospace">z_t ∈ ℝ^768</text>
  <rect x="420" y="38" width="200" height="72" rx="5" fill="#fff" stroke="#3b82f6" stroke-width="1"/>
  <text x="520" y="56" text-anchor="middle" font-size="10" font-weight="600">Audio</text>
  <text x="520" y="74" text-anchor="middle" font-size="8.5" fill="#334155">MFCC (mean + std)</text>
  <text x="520" y="92" text-anchor="middle" font-size="8.5" fill="#1e40af" font-family="Consolas,monospace">z_a ∈ ℝ^26</text>

  <!-- три ветви сходятся в (410, 200), затем в BiLSTM -->
  <polyline points="300,126 300,200 410,200" fill="none" stroke="#0f172a" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="300" y="142" text-anchor="middle" font-size="7.5" fill="#0369a1">only text</text>
  <text x="300" y="192" text-anchor="middle" font-size="7" fill="#64748b" font-family="Consolas,monospace">d = 768</text>

  <polyline points="520,126 520,200 410,200" fill="none" stroke="#0f172a" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="520" y="142" text-anchor="middle" font-size="7.5" fill="#0369a1">only audio</text>
  <text x="520" y="192" text-anchor="middle" font-size="7" fill="#64748b" font-family="Consolas,monospace">d = 26</text>

  <line x1="410" y1="126" x2="410" y2="200" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round"/>
  <text x="418" y="158" text-anchor="start" font-size="7.5" fill="#0369a1">text + audio</text>
  <text x="410" y="214" text-anchor="middle" font-size="7" fill="#64748b" font-family="Consolas,monospace">x = [z_t; z_a],  d = 768+26 = 794</text>

  <line x1="410" y1="200" x2="410" y2="226" stroke="#0f172a" stroke-width="1.6" marker-end="url(#m)"/>

  <!-- ========== BiLSTM ========== -->
  <rect x="230" y="228" width="360" height="168" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.3" filter="url(#sh)"/>
  <text x="410" y="248" text-anchor="middle" font-size="11" font-weight="600">SeqContext (BiLSTM)</text>
  <rect x="250" y="258" width="320" height="36" rx="4" fill="#fff" stroke="#10b981" stroke-width="1"/>
  <text x="410" y="276" text-anchor="middle" font-size="9" font-weight="600">Layer 1</text>
  <text x="410" y="288" text-anchor="middle" font-size="7.5" fill="#475569" font-family="Consolas,monospace">LSTM: d_in → g/2 (for each direction)</text>
  <rect x="250" y="302" width="320" height="36" rx="4" fill="#fff" stroke="#10b981" stroke-width="1"/>
  <text x="410" y="320" text-anchor="middle" font-size="9" font-weight="600">Layer 2</text>
  <text x="410" y="332" text-anchor="middle" font-size="7.5" fill="#475569" font-family="Consolas,monospace">second bidirectional LSTM, num_layers = 2</text>
  <rect x="250" y="346" width="320" height="42" rx="4" fill="#fff" stroke="#10b981" stroke-width="1"/>
  <text x="410" y="362" text-anchor="middle" font-size="8.5" font-weight="600">Input → Output</text>
  <text x="410" y="378" text-anchor="middle" font-size="7.5" fill="#334155" font-family="Consolas,monospace">x ∈ ℝ^{B×T×d}  →  h ∈ ℝ^{B×T×g}</text>

  <line x1="410" y1="396" x2="410" y2="428" stroke="#0f172a" stroke-width="1.6" marker-end="url(#m)"/>

  <!-- ========== batch_graphify ========== -->
  <rect x="120" y="428" width="580" height="168" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3" filter="url(#sh)"/>
  <text x="410" y="450" text-anchor="middle" font-size="11" font-weight="600">batch_graphify (creating a graph)</text>
  <text x="410" y="470" text-anchor="middle" font-size="8.5" fill="#334155">
    <tspan x="410" dy="0">For each example of the batch, edges are built between replicas in the window [j−w_p, j+w_f];</tspan>
    <tspan x="410" dy="12">graph edge type r ∈ {1,…,2S²} encodes a pair of speakers (s_i, s_j) and direction in time δ.</tspan>
  </text>
  <text x="410" y="508" text-anchor="middle" font-size="7.5" fill="#475569" font-family="Consolas,monospace">Nodes V: features from h</text>
  <text x="410" y="524" text-anchor="middle" font-size="7.5" fill="#475569" font-family="Consolas,monospace">Edges E = {(u,v)} · edge type r(u,v)</text>
  <text x="410" y="542" text-anchor="middle" font-size="7.5" fill="#475569" font-family="Consolas,monospace">|R| = 2S² types of edges (RGCN)</text>
  <text x="410" y="560" text-anchor="middle" font-size="7.5" fill="#475569" font-family="Consolas,monospace">w_p, w_f — past and future windows by replica indices</text>

  <line x1="410" y1="596" x2="410" y2="628" stroke="#0f172a" stroke-width="1.6" marker-end="url(#m)"/>

  <!-- ========== GNN ========== -->
  <rect x="180" y="628" width="460" height="142" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="1.3" filter="url(#sh)"/>
  <text x="410" y="646" text-anchor="middle" font-size="11" font-weight="600">GNN</text>
  <rect x="200" y="658" width="420" height="48" rx="4" fill="#fff" stroke="#e11d48" stroke-width="1"/>
  <text x="410" y="672" text-anchor="middle" font-size="9" font-weight="600">RGCNConv</text>
  <text x="410" y="686" text-anchor="middle" font-size="7.8" fill="#334155">Updating nodes by neighbors; separate weights for each edge type r.</text>
  <text x="410" y="700" text-anchor="middle" font-size="8" fill="#475569" font-family="Consolas,monospace">H^(1) = RGCN(H^(0), E, r),  H^(0) ≡ h</text>

  <rect x="200" y="712" width="420" height="50" rx="4" fill="#fff" stroke="#e11d48" stroke-width="1"/>
  <text x="410" y="726" text-anchor="middle" font-size="9" font-weight="600">TransformerConv</text>
  <text x="410" y="740" text-anchor="middle" font-size="7.8" fill="#334155">Attention to neighbors on the edges, several attention heads</text>
  <text x="410" y="752" text-anchor="middle" font-size="8" fill="#475569" font-family="Consolas,monospace">H^(2) = TransConv(H^(1), E)</text>

  <line x1="410" y1="770" x2="410" y2="786" stroke="#0f172a" stroke-width="1.6" marker-end="url(#m)"/>

  <!-- ========== Классификатор ========== -->
  <rect x="180" y="786" width="460" height="98" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3" filter="url(#sh)"/>
  <text x="410" y="808" text-anchor="middle" font-size="11" font-weight="600">Classifier (MLP)</text>
  <text x="410" y="836" text-anchor="middle" font-size="8.5" fill="#334155">Combining context and graph features for a replica</text>
  <text x="410" y="851" text-anchor="middle" font-size="8.5" fill="#334155">Two fully connected layers and emotion distribution</text>
  <text x="410" y="867" text-anchor="middle" font-size="9" fill="#0f172a" font-weight="600">Output: each utterance has an emotion label (7 classes).</text>

</svg>
</div>

<p class="lead">Model diagram: B is the batch size, T is the number of replicas in the example, N is the number of nodes in the merged batch graph, S is the number of speaker types (or buckets), d is the input dimension to BiLSTM.</p>


</body>
</html>
